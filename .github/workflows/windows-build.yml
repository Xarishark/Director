name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Director
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust and WiX
        run: |
          rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DOTNET_ROLL_FORWARD = 'Major'
          dotnet tool install wix --version 6.0.2 --tool-path (Join-Path $env:RUNNER_TEMP 'director-wix')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check, test, and build Director
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ build tools were not found.' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:RUSTUP_TOOLCHAIN = '1.95.0-x86_64-pc-windows-msvc'
          ./scripts/dev.ps1 fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/dev.ps1 clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/dev.ps1 test --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/dev.ps1 build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the x64 MSI
        run: |
          $env:DOTNET_ROLL_FORWARD = 'Major'
          ./scripts/package-msi.ps1 -UseExistingRelease -Wix (Join-Path $env:RUNNER_TEMP 'director-wix\wix.exe')

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Director-Windows-x64
          path: target/installer/Director-*-x64.msi
          if-no-files-found: error
          retention-days: 14
