[package]
name = "director"
version = "0.13.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Switch displays, audio, and TVs with reusable scenes on Windows."
authors = ["Xarishark • Zacharias Xenakis"]
license = "MIT"
repository = "https://github.com/Xarishark/Director"

[dependencies]
windows-reactor = "=0.100.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Devices_Display", "Win32_Graphics_Gdi", "ApplicationModel_DataTransfer", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
    "Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell_Common", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem",
] }

# Android TV Remote v2: in-process TLS and per-TV RSA client identity.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
resvg = { version = "0.48.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"




